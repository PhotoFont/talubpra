<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกรับเลี่ยมพระ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center">🙏 บันทึกข้อมูลรับเลี่ยมพระ</h3>
                <form action="/add" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">ชื่อลูกค้า</label>
                        <input type="text" name="customer_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">เบอร์โทรศัพท์</label>
                        <input type="text" name="phone" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ลักษณะพระ / ชนิดพระ</label>
                        <input type="text" name="amulet_type" class="form-control" placeholder="เช่น เหรียญหลวงพ่อ... / พระสมเด็จ" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">วัสดุกรอบที่ต้องการ</label>
                        <input type="text" name="frame_material" class="form-control" placeholder="เช่น ทองคำแท้ / เงินแท้ / ทองฝังเพชร" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ราคาค่าเลี่ยม (บาท)</label>
                        <input type="number" step="any" name="price" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>รูปถ่ายพระก่อนเลี่ยม (เลือกได้หลายรูป)</label>
                        <input type="file" name="before_images" accept="image/*" multiple class="form-control">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">บันทึกข้อมูล</button>
                        <a href="/" class="btn btn-secondary">ย้อนกลับ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
